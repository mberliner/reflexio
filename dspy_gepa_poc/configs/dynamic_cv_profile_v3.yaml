# Config v3: extraccion sobre CVs EXTENSOS y realistas (estilo modelos_cv)
# generados por shared/cv_synth/. Mismo catalogo que cv_triage_v3 (cada CV
# alimenta triage y profile a la vez), por lo que el gold de extraccion se DERIVA
# del mismo CandidateSpec estructurado: correcto por construccion.
#
# Diferencia clave con v2: el techo de v2 vivia en industria_previa (gold de
# definicion difusa: 'Diseño' vs 'Diseño UX', 'Backend' como industria). En v3 el
# gold sale de un vocabulario controlado del spec, asi que el techo deberia subir
# y el error residual reflejar dificultad REAL de extraccion sobre texto largo
# (no ambiguedad de etiqueta). La señal viva: ¿el modelo extrae años/stack/idioma
# correctos de un CV de 30 lineas con ruido y multiples puestos?
#
# Regenerar dataset: python -m shared.cv_synth.build_datasets
# Criterio de exito: gap val-test <= 3 pts y robustez fiable (test=24, no test=8).
case:
  name: "cv_profile_v3"
  title: "CV Profile Extraction v3 (Espanol, CVs extensos) (DSPy)"
  description: "Extraccion de perfil de CV en espanol sobre CVs extensos (v3)"

module:
  type: "dynamic"

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

signature:
  instruction: "Extrae un perfil estructurado del candidato a partir del texto del CV. El CV es extenso (varias secciones, multiples puestos, posible ruido). Identifica los datos personales, experiencia profesional, stack tecnico, idiomas, ubicacion e industria previa. Si un campo no esta explicitamente mencionado en el CV, devolvelo como cadena vacia. No inventes informacion."
  inputs:
    - name: "text"
      desc: "El texto completo y extenso del CV del cual extraer el perfil del candidato."
  outputs:
    - name: "nombre"
      desc: "El nombre completo del candidato, sin honorificos ni titulos academicos (Dr., Lic., Ing., La Dra., etc.)."
    - name: "email"
      desc: "La direccion de email de contacto."
    - name: "años_experiencia"
      desc: "Total de años de experiencia profesional (como numero entero, sin texto adicional)."
    - name: "skills"
      desc: "Lista de habilidades y tecnologias mencionadas, separadas por coma."
    - name: "educacion_principal"
      desc: "Titulo academico mas alto e institucion (formato: 'Titulo, Institucion')."
    - name: "seniority_declarado"
      desc: "Nivel de seniority si esta declarado explicitamente en el CV. Valores posibles: junior, semi_senior, senior, lead. Cadena vacia si no esta declarado."
    - name: "stack_principal"
      desc: "Competencias y tecnologias principales separadas por punto y coma. Si el CV indica años de experiencia por tecnologia, usar formato 'Tecnologia:años' (ej: 'Python:5; Django'). Si no, solo el nombre."
    - name: "idiomas"
      desc: "Idiomas con su nivel, separados por punto y coma. Formato: 'idioma:nivel' (ej: 'español:nativo; ingles:b2'). Cadena vacia si no se mencionan."
    - name: "ubicacion"
      desc: "Ciudad y pais de residencia actual del candidato (ej: 'Buenos Aires, Argentina'), solo si lo declara explicitamente. No inferir desde el dominio del email. Cadena vacia si no esta declarado explicitamente."
    - name: "industria_previa"
      desc: "Sector economico o disciplina tecnica principal del candidato (ej: 'Fintech', 'E-commerce', 'Backend', 'Frontend', 'Ciencia de Datos', 'QA', 'DevOps', 'Mobile'). Cadena vacia solo si no hay informacion suficiente para inferirlo."

data:
  csv_filename: "cv_profile_v3.csv"
  input_column: "text"

adapter:
  max_text_length: 4000
  max_positive_examples: 2

optimization:
  max_metric_calls: 50
  auto_budget: "heavy"
  use_few_shot: true
  few_shot_count: 2
  eval_repeats: 1
  ignore_in_metric: [seniority_declarado]
  match_mode: "normalized"
  fuzzy_threshold: 0.88
  metric_feedback: true
  field_configs:
    nombre: { mode: "normalized" }
    email: { mode: "normalized" }
    años_experiencia: { mode: "exact" }
    skills: { mode: "set", separators: ",;" }
    educacion_principal: { mode: "fuzzy", fuzzy_threshold: 0.85 }
    seniority_declarado: { mode: "exact" }
    stack_principal: { mode: "set", separators: ";," }
    idiomas: { mode: "set", separators: ";," }
    ubicacion: { mode: "fuzzy", fuzzy_threshold: 0.85 }
    industria_previa: { mode: "fuzzy", fuzzy_threshold: 0.85 }
