case:
  name: "Intake Pipeline (Triage + Fast Gate)"

module:
  type: "pipeline"

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

stages:
  - name: "triage"
    predictor_type: "cot"
    signature:
      instruction: |
        Evalua una ficha de intent y decide su triage segun las reglas del Marco
        de Gobierno de IA. Examina solidez (Paso 1), factibilidad (Paso 2) y
        chequeos especiales (§7.4 y §9.2).

        Posibles decisiones de triage_decision:
        - avanza_fast_gate: la ficha pasa al Fast Gate para clasificacion P1-P5.
        - devolucion_reformulacion: falla solidez en Paso 1 (campo ausente,
          intent describe tecnologia en vez de resultado, sin sponsor
          individual, metricas no medibles, contradiccion interna).
        - devolucion_no_ia: el intent no requiere IA (es mejora de proceso/BPM).
        - no_avanza: factibilidad insuficiente en Paso 2 (proveedor fuera de
          jurisdiccion, restricciones estructurales no negociables).
        - avanza_con_redisenio: factibilidad alcanzable con rediseno (Paso 2).
        - rechazo_formal: violacion de uso prohibido §9.2 (variables
          discriminatorias, atributos protegidos en decision de acceso).
        - derivar_preclasificado: caso identico a uno ya pre-clasificado en el
          catalogo N2 §7.4.

        triage_etapa indica la fase donde se detecto la decision:
        paso_1, paso_2, fast_gate, seccion_9_2.

        razonamiento_triage: explica brevemente la causa.
      inputs:
        - name: "text"
          desc: "Ficha completa de intent (todos los campos declarados)."
      outputs:
        - name: "triage_decision"
          desc: "Una de: avanza_fast_gate, devolucion_reformulacion, devolucion_no_ia, no_avanza, avanza_con_redisenio, rechazo_formal, derivar_preclasificado."
        - name: "triage_etapa"
          desc: "Una de: paso_1, paso_2, fast_gate, seccion_9_2."
        - name: "razonamiento_triage"
          desc: "Justificacion breve (1-2 oraciones) de la decision de triage."

  - name: "fast_gate"
    predictor_type: "cot"
    signature:
      instruction: |
        Esta etapa solo se invoca cuando triage_decision = avanza_fast_gate.
        Evalua los 5 criterios P1-P5 sobre la ficha y deriva el color
        Verde/Amarillo/Rojo/Negro segun la matriz del Marco.

        P1: hay impacto sobre personas (clientes o empleados como sujetos)?
        P2: el sistema afecta tipos de persona definidos (cliente, empleado,
            corporativo)?
        P3: usa modelo/LLM externo sin homologar al momento del analisis?
        P4: procesa datos personales o confidenciales?
        P5: actua sin revision humana previa por caso (revision ex-post o
            ninguna)?

        Cada Pi toma valor 'si' o 'No' (P3 ya fue desambiguado en los datos;
        no usar 'Ambiguo').

        Matriz simplificada:
        - P1=No -> Verde.
        - P1=si, criterios moderados -> Amarillo.
        - P1=si + (P3=si o P4=si con criticidad alta) -> Rojo.
        - P1=si + P5=si (sin revision humana previa) -> Negro (escalada §7.3).

        razonamiento_fg: explica brevemente como se aplico la matriz.
      inputs:
        - name: "text"
          desc: "Ficha completa de intent."
      outputs:
        - name: "p1"
          desc: "'si' o 'No'."
        - name: "p2"
          desc: "'si' o 'No'."
        - name: "p3"
          desc: "'si' o 'No'."
        - name: "p4"
          desc: "'si' o 'No'."
        - name: "p5"
          desc: "'si' o 'No'."
        - name: "clasificacion"
          desc: "Una de: Verde, Amarillo, Rojo, Negro."
        - name: "razonamiento_fg"
          desc: "Justificacion breve (1-2 oraciones) de la clasificacion."

routing:
  gate_stage: "triage"
  gate_field: "triage_decision"
  gate_value: "avanza_fast_gate"
  skip_outputs_when_gated:
    p1: "no_aplica"
    p2: "no_aplica"
    p3: "no_aplica"
    p4: "no_aplica"
    p5: "no_aplica"
    clasificacion: "no_aplica"
    razonamiento_fg: ""

data:
  csv_filename: "fast_gate_cases.csv"
  input_columns:
    - "text"

adapter:
  max_text_length: 4000

optimization:
  # Budget aumentado a 150 porque el pipeline tiene 2 predictores (triage +
  # fast_gate); con el budget de 90 cada predictor recibia ~45 iteraciones, la
  # mitad de lo que GEPA standalone (1 predictor) recibe con su mismo budget.
  max_metric_calls: 150
  # auto_budget removido: puede sobreescribir max_metric_calls de forma
  # inconsistente. Si se quiere recuperar, comentar max_metric_calls primero.
  predictor_type: "cot"
  match_mode: "normalized"
  metric_feedback: true
  # Numero de repeticiones de las evaluaciones FINALES (baseline/optimized/test).
  # Bajado a 1: con N>=3 runs en el benchmark, la varianza inter-run ya cubre
  # el ruido del LLM no-determinista. k=3 triplicaba calls sin info adicional.
  eval_repeats: 1
  ignore_in_metric:
    - "razonamiento_triage"
    - "razonamiento_fg"
    - "razonamiento"
  field_configs:
    triage_decision: { mode: "exact" }
    triage_etapa: { mode: "exact" }
    p1: { mode: "exact" }
    p2: { mode: "exact" }
    p3: { mode: "exact" }
    p4: { mode: "exact" }
    p5: { mode: "exact" }
    clasificacion: { mode: "exact" }
