# Config v2 para protocolo de N seeds. Ver shared/utils/seed_protocol.py
#
# Diagnostico (historico v1): robustez "100%" enganosa por dataset diminuto
# (test=8) y desbalanceado + GEPA "ciego" (match exact sin feedback) ->
# seleccion volatil del optimizado (66->100).
#
# Diagnostico (corrida N=5, 2026-05-30): con task=gpt-5-mini el dataset
# balanceado quedo EN TECHO: baseline 100 en val, GEPA delta cero ("no modifico
# instructions"), robustez 97.8 (ver seccion 9 de docs/LECCIONES_APRENDIDAS.md).
# El dataset nitido separa fit_alto/fit_medio/no_fit trivialmente para el modelo.
#
# Intervencion v2.1 (opcion B - recrear headroom sin bajar el modelo):
#   - cv_triage_v2.csv ahora incluye 15 casos FRONTERA fit_alto<->fit_medio con
#     ambiguedad en un solo eje (ingles B1 vs B2, 5 años exactos vs casi-5, huso
#     GMT vs residencia LATAM, Flask/Tornado vs Django/FastAPI, PostgreSQL
#     ausente). Generados en shared/utils/build_cv_v2_datasets.py. test 21 -> 27.
#     Objetivo: forzar decisiones donde gpt-5-mini puede diferir del gold y GEPA
#     tenga algo que optimizar. Gold defendible pero discutible (gold_verificado
#     ="no": revision humana PRIORITARIA antes de cerrar conclusiones).
#   - eval_repeats: 3        -> baja ruido de muestreo del LLM.
#   - metric_feedback: true  -> emite "fit_label esperado X / predijo Y" para que
#     el reflection_lm construya una rubrica de decision estable.
# Criterio de exito: baseline < 100 (hay headroom), macro-F1 ↑ via GEPA, rango
# entre seeds ↓. Si el baseline sigue saturando, evaluar opcion A (task=gpt-4.1-mini).
case:
  name: "cv_triage_v2"
  title: "CV Triage v2 (Backend Senior Python LATAM) (DSPy)"
  description: "Clasificacion de fit de CVs para Backend Senior Python LATAM (v2)"

module:
  type: "dynamic"

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

signature:
  instruction: "Dada una descripcion de puesto (job_description) y el texto de un CV (cv_text), clasifica el grado de fit del candidato como uno de tres valores exactos: 'fit_alto', 'fit_medio', 'no_fit'. Tambien produce una justificacion corta (1-2 oraciones) citando evidencia concreta del CV.\n\nCriterios:\n- fit_alto: cumple stack tecnico, seniority, idiomas y ubicacion sin observaciones.\n- fit_medio: cumple el nucleo tecnico pero falla en al menos un requisito (idioma, seniority, ubicacion, o stack adyacente).\n- no_fit: perfil tecnico desalineado (otro lenguaje, otra disciplina) o falla en multiples requisitos criticos.\n\nNo inventes informacion que el CV no menciona."
  inputs:
    - name: "cv_text"
      desc: "Texto completo del CV del candidato."
    - name: "job_description"
      desc: "Descripcion del puesto a cubrir, con requisitos de stack, seniority, idiomas, ubicacion e industria."
  outputs:
    - name: "fit_label"
      desc: "Clasificacion exacta. Valores permitidos: 'fit_alto', 'fit_medio', 'no_fit'."
    - name: "justificacion"
      desc: "Justificacion corta (1-2 oraciones) citando evidencia del CV que respalda la clasificacion."

data:
  # PREREQUISITO: crear dataset balanceado/ampliado (test>=20, clases parejas).
  csv_filename: "cv_triage_v2.csv"
  input_columns:
    - "cv_text"
    - "job_description"

adapter:
  max_text_length: 2500
  max_positive_examples: 3

optimization:
  max_metric_calls: 60
  auto_budget: "medium"
  use_few_shot: true
  few_shot_count: 3
  eval_repeats: 1
  ignore_in_metric:
    - "justificacion"
  match_mode: "exact"
  # Habilita feedback textual: GEPA deja de estar ciego en la clasificacion.
  metric_feedback: true
  field_configs:
    fit_label: { mode: "exact" }
