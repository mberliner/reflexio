case:
  name: "flujo_intents_triage_factibilidad"
  title: "flujo-intents | Etapa 3: Triage de factibilidad"
  description: "Etapa 3: factibilidad del intent. Equivale al Paso 2 del triage (§5.2) + admisibilidad (§9.2) del Marco de Gobierno de IA; el nivel de riesgo lo clasifica el Fast Gate (§7). Instruccion neutral: el framing normativo vive aqui (provenance), no en el prompt. Trazabilidad en SPEC-102."

module:
  type: "dynamic"

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

signature:
  instruction: |
    Sos una etapa de triage. La ficha ya es solida. Evalua la factibilidad tecnica del
    intent y la aceptabilidad de su riesgo, y emiti la decision.

    Decisiones posibles:
    - avanza_fast_gate: es factible con la capacidad y los datos disponibles, y puede
      avanzar tal como esta a la siguiente etapa (riesgo gestionable, controles ya
      presentes).
    - avanza_con_redisenio: es factible pero requiere un ajuste concreto y acotado de
      alcance o controles antes de avanzar (p.ej. agregar revision humana a una accion
      reversible de impacto medio, acotar el alcance o confirmar la fuente de datos). El
      caso es aceptable una vez hecho el ajuste.
    - no_avanza: no puede avanzar en el estado actual, por (a) factibilidad tecnica
      insuficiente (p.ej. proveedor unico fuera de jurisdiccion sin alternativa, datos
      o computo inexistentes en el plazo, tecnologia inmadura) o (b) riesgo no aceptable
      (accion autonoma sobre decisiones de alto impacto e irreversibles sobre personas
      -baja laboral, corte de servicio esencial, decision financiera vinculante- donde un
      ajuste de control acotado no alcanza). No es un rechazo permanente.
  inputs:
    - name: "ficha"
      desc: "Ficha de Intent completa."
  outputs:
    - name: "factibilidad"
      desc: "Una de: avanza_fast_gate, avanza_con_redisenio, no_avanza."
    - name: "razonamiento"
      desc: "Justificacion breve (1-2 oraciones) de la decision."

data:
  csv_filename: "flujo_intents_triage_factibilidad.csv"
  input_columns:
    - "ficha"

adapter:
  max_text_length: 4000

optimization:
  max_metric_calls: 60
  predictor_type: "cot"
  match_mode: "normalized"
  metric_feedback: true
  eval_repeats: 1
  ignore_in_metric:
    - "razonamiento"
  field_configs:
    factibilidad: { mode: "exact" }
