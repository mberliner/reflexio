[project]
name = "reflexio"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Modulo de datos: casos de ficha hechos a mano con textos largos en espanol.
"dspy_gepa_poc/flujo_intents/make_variations.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
