[project]
name = "reflexio"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Modulo de datos: casos de ficha hechos a mano con textos largos en espanol.
"dspy_gepa_poc/flujo_intents/make_variations.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
# dspy 3.4 depreca el LM propio via BaseLM.forward (CheckedLM, SPEC-105 FR-002
# transicion); se reemplaza por el engine propio antes de dspy 3.5 (D-018 b3).
filterwarnings = [
    "ignore:Implementing custom LMs through BaseLM.forward:DeprecationWarning",
]
