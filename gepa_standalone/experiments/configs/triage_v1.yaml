# GEPA Universal Optimizer Configuration
# Caso: Triage v1 (decision de triage del Marco)

case:
  name: "triage_v1"
  title: "Triage v1"
  description: "Decision de triage del Marco (avanza_fast_gate vs rechazos/devoluciones)"

data:
  csv_filename: "triage_v1.csv"
  input_column: "text"
  output_columns:
    - "triage_decision"
    - "triage_etapa"
    - "razonamiento"

prompt:
  filename: "triage_v1.json"

adapter:
  type: "extractor"
  required_fields:
    - "triage_decision"
    - "triage_etapa"
    - "razonamiento"
  max_text_length: 4000
  extractor_max_positive_examples: 0

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

optimization:
  max_metric_calls: 90
  skip_perfect_score: true
  display_progress_bar: true
  eval_repeats: 1
  ignore_in_metric:
    - "razonamiento"
