# GEPA Universal Optimizer Configuration
# Config v3: extraccion (5 campos) sobre CVs EXTENSOS y realistas estilo
# modelos_cv, generados por shared/cv_synth/. Mismo catalogo que cv_triage_v3 y
# cv_profile_v3 (cada CV alimenta los tres casos), gold DERIVADO del spec
# estructurado: correcto por construccion (gold_verificado="derivado").
#
# Diferencia con v2: v2 usaba CVs cortos hand-written (gold borrador, test=20).
# v3 son CVs de 25-40 lineas con multiples puestos, proyectos y ruido: la
# extraccion exacta de nombre/email/años/skills/educacion es genuinamente mas
# dificil (hay que leer texto largo y descartar distractores). Es el caso que en
# la seccion 9 mostro headroom real (52->81); v3 mide si los CVs extensos lo
# mantienen o lo elevan, ahora con gold confiable.
#
# Regenerar dataset: python -m shared.cv_synth.build_datasets
# Se conserva el prompt semilla v1 (la intervencion es dataset, no el prompt).
# Criterio de exito: rango entre seeds del test colapsado (test=24) y, si hay
# margen, mejora reproducible del score via GEPA.

case:
  name: "cv_extraction_v3"
  title: "CV Extraction v3 (CVs extensos)"
  description: "Extraccion estructurada de 5 campos sobre CVs extensos estilo modelos_cv"

adapter:
  type: "extractor"
  required_fields:
    - "nombre"
    - "email"
    - "años_experiencia"
    - "skills"
    - "educacion_principal"
  max_text_length: 4000
  extractor_max_positive_examples: 0

data:
  csv_filename: "cv_extraction_v3.csv"
  input_column: "text"
  output_columns:
    - "nombre"
    - "email"
    - "años_experiencia"
    - "skills"
    - "educacion_principal"

prompt:
  filename: "cv_extraction_v1.json"

optimization:
  max_metric_calls: 40
  skip_perfect_score: true
  display_progress_bar: true
  # Promedia val/test sobre N evaluaciones para reducir ruido de muestreo.
  eval_repeats: 1
