# GEPA Universal Optimizer Configuration
# Caso: Fast Gate v1 (clasificacion P1-P5 sobre casos que avanzan)

case:
  name: "fast_gate_v1"
  title: "Fast Gate v1"
  description: "Clasificacion P1-P5 y color Verde/Amarillo/Rojo/Negro sobre casos avanza_fast_gate"

data:
  csv_filename: "fast_gate_v1.csv"
  input_column: "text"
  output_columns:
    - "p1"
    - "p2"
    - "p3"
    - "p4"
    - "p5"
    - "clasificacion"
    - "razonamiento"

prompt:
  filename: "fast_gate_v1_only.json"

adapter:
  type: "extractor"
  required_fields:
    - "p1"
    - "p2"
    - "p3"
    - "p4"
    - "p5"
    - "clasificacion"
    - "razonamiento"
  max_text_length: 4000
  extractor_max_positive_examples: 0

models:
  cache: false
  temperature: 0.1
  max_tokens: 4000

optimization:
  max_metric_calls: 90
  skip_perfect_score: true
  display_progress_bar: true
  eval_repeats: 1
  ignore_in_metric:
    - "razonamiento"
