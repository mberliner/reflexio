# GEPA Universal Optimizer Configuration
# Config v2 para protocolo de N seeds. Ver shared/utils/seed_protocol.py
#
# Diagnostico: con test=3 cualquier score es anecdotico (test salta 0.80-1.00).
# El objetivo del v2 NO es subir el score sino que el rango entre seeds se colapse.
#
# Intervenciones respecto del baseline:
#   1. csv_filename: cv_extraction_v2.csv -> PREREQUISITO: test ampliado de 3 a >=20.
#      Curar ejemplos REALES; no fabricar para no invalidar la medicion de robustez.
#   2. eval_repeats: 3                     -> baja ruido de muestreo del LLM.
# Se conserva el prompt semilla v1 (la intervencion es dataset + medicion, no el prompt).
# Criterio de exito: rango entre seeds del test se colapsa (medicion fiable).

case:
  name: "cv_extraction_v2"
  title: "CV Extraction v2"
  description: "Extraccion estructurada de datos de CVs (dataset ampliado)"

adapter:
  type: "extractor"
  required_fields:
    - "nombre"
    - "email"
    - "años_experiencia"
    - "skills"
    - "educacion_principal"
  max_text_length: 1000
  extractor_max_positive_examples: 0

data:
  # PREREQUISITO: crear dataset con test ampliado (>=20 ejemplos).
  csv_filename: "cv_extraction_v2.csv"
  input_column: "text"
  output_columns:
    - "nombre"
    - "email"
    - "años_experiencia"
    - "skills"
    - "educacion_principal"

prompt:
  filename: "cv_extraction_v1.json"

optimization:
  max_metric_calls: 40
  skip_perfect_score: true
  display_progress_bar: true
  # Promedia val/test sobre 3 evaluaciones para reducir ruido de muestreo.
  eval_repeats: 3
